name: Build QuickLaunch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos
  CI: true

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只构建隐根（RootHide）包，避免多矩阵任务抢同一个 Release 标签
          - build_variant: roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide fork, Linux)
        run: |
          set -euo pipefail
          export CI=1
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Package
        run: |
          sh build.sh "${{ matrix.build_variant }}"
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "快捷启动 v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
